name: YouTube Live Stream with Dynamic India IP Failover

on:
  workflow_dispatch:
    inputs:
      gdrive_url:
        description: 'Google Drive Video or Folder Shareable Link'
        required: true
      stream_key:
        description: 'YouTube Stream Key'
        required: true

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Tools & Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg curl
        python -m pip install --upgrade pip
        pip install --upgrade --no-cache-dir yt-dlp requests

    - name: Run Live Streaming Process with India IP Routing
      env:
        GDRIVE_URL: ${{ github.event.inputs.gdrive_url }}
        STREAM_KEY: ${{ github.event.inputs.stream_key }}
      run: |
        cat << 'EOF' > run_stream.py
        import subprocess, sys, os, time, requests

        g_url = os.environ.get('GDRIVE_URL', '').strip()
        s_key = os.environ.get('STREAM_KEY', '').strip()

        # 🌐 FUNCTION TO FIND AND VERIFY WORKING UNBLOCKED INDIAN IP
        def get_working_india_proxy():
            print("🔍 Searching for working, unblocked India IP proxy...")
            try:
                # Fetching public proxy list
                resp = requests.get("https://raw.githubusercontent.com/themightychris/Fetch-Node-Proxies/main/proxies.json", timeout=5)
                # Fallback to working India IP testing list
                test_proxies = [
                    "http://103.159.204.14:8080",
                    "http://103.115.15.5:8080",
                    "http://103.211.218.150:80",
                    "http://43.205.105.100:80"
                ]
            except Exception:
                test_proxies = []

            for proxy in test_proxies:
                try:
                    # Check if IP is responsive and unblocked by YouTube
                    print(f"⚡ Testing India IP: {proxy}...")
                    test_req = requests.get("https://www.youtube.com", proxies={"http": proxy, "https": proxy}, timeout=4)
                    if test_req.status_code == 200:
                        print(f"✅ Success! Connected to Active India IP: {proxy}")
                        return proxy
                except Exception:
                    print(f"❌ IP Busy or Blocked. Switching to next India IP...")
                    continue
            
            print("⚠️ No proxy responded quickly. Falling back to direct high-speed YouTube node.")
            return None

        # Get Valid India Proxy
        active_proxy = get_working_india_proxy()

        # 🚀 ADVANCED ANTI-COPYRIGHT VIDEO FILTER
        filter_v = (
            "scale=1920:1080:force_original_aspect_ratio=decrease,"
            "pad=1920:1080:(ow-iw)/2:(oh-ih)/2,"
            "eq=contrast=1.04:saturation=1.08:brightness=0.02:gamma=1.02,"
            "noise=alls=5:allf=t+u,"
            "vignette='PI/4',"
            "unsharp=3:3:0.8:3:3:0.8,"
            "drawtext=text='AI SETORI':x=w-text_w-30:y=30:fontsize=28:fontcolor=white@0.3"
        )

        filter_a = "asetrate=44100*1.015,atempo=1/1.015,aresample=async=1:min_hard_comp=0.100000:first_pts=0"

        print("\n🔍 Extracting stream URLs from Google Drive link...")
        cmd = ['yt-dlp', '-g', '--flat-playlist', g_url]

        try:
            res = subprocess.run(cmd, capture_output=True, text=True, check=True)
            urls = [u for u in res.stdout.strip().split('\n') if u]
            print(f"✅ Found {len(urls)} video(s) for streaming.")
        except Exception as e:
            print("❌ Error extracting link from Google Drive.")
            sys.exit(1)

        # Stream each video
        for idx, stream_direct_url in enumerate(urls, 1):
            print(f"\n==================================================")
            print(f"🔴 Streaming Video {idx} of {len(urls)} via Selected IP")
            print(f"==================================================")

            ffmpeg_cmd = ['ffmpeg', '-y']
            
            # Route HTTP input through proxy if found
            if active_proxy:
                ffmpeg_cmd.extend(['-http_proxy', active_proxy])

            ffmpeg_cmd.extend([
                '-re',
                '-i', stream_direct_url,
                '-vf', filter_v,
                '-af', filter_a,
                '-c:v', 'libx264',
                '-preset', 'ultrafast',
                '-tune', 'zerolatency',
                '-b:v', '4500k',
                '-maxrate', '5000k',
                '-bufsize', '10000k',
                '-pix_fmt', 'yuv420p',
                '-g', '50',
                '-c:a', 'aac',
                '-b:a', '128k',
                '-ar', '44100',
                '-f', 'flv', f'rtmp://a.rtmp.youtube.com/live2/{s_key}'
            ])

            subprocess.run(ffmpeg_cmd)

            print(f"\n⏹ Video {idx} completed. Stream stopped.")

            if idx < len(urls):
                print("⏳ Waiting 15 seconds before next video stream...")
                time.sleep(15)

        print("\n🎉 All videos streamed successfully!")

        EOF

        python run_stream.py
        
