name: YouTube Live Stream Auto-Split - Google Drive

on:
  workflow_dispatch:
    inputs:
      gdrive_url:
        description: 'Google Drive Folder Shareable Link'
        required: true
      stream_key:
        description: 'YouTube Stream Key'
        required: true

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg curl
        python -m pip install --upgrade pip
        pip install --upgrade --no-cache-dir gdown yt-dlp

    - name: Run Direct Live Streaming Process
      env:
        GDRIVE_URL: ${{ github.event.inputs.gdrive_url }}
        STREAM_KEY: ${{ github.event.inputs.stream_key }}
      run: |
        cat << 'EOF' > run_stream.py
        import subprocess, sys, os, time, glob

        g_url = os.environ.get('GDRIVE_URL', '').strip()
        s_key = os.environ.get('STREAM_KEY', '').strip()

        # 🚀 ADVANCED ANTI-COPYRIGHT & WATERMARK FILTER
        filter_v = (
            "scale=1920:1080:force_original_aspect_ratio=decrease,"
            "pad=1920:1080:(ow-iw)/2:(oh-ih)/2,"
            "eq=contrast=1.04:saturation=1.08:brightness=0.02:gamma=1.02,"
            "noise=alls=5:allf=t+u,"
            "vignette='PI/4',"
            "unsharp=3:3:0.8:3:3:0.8,"
            "drawtext=text='AI SETORI':x=w-text_w-30:y=30:fontsize=28:fontcolor=white@0.3"
        )

        filter_a = "asetrate=44100*1.015,atempo=1/1.015,aresample=async=1:min_hard_comp=0.100000:first_pts=0"

        print("🔍 Downloading videos from Google Drive folder...")
        os.makedirs("downloads", exist_ok=True)
        
        # Download folder via gdown using correct syntax
        dl_cmd = ['gdown', '--folder', g_url, '-O', 'downloads']

        try:
            subprocess.run(dl_cmd, check=True)
        except Exception as e:
            print("⚠️ Folder download failed... Trying direct download as single file.")
            try:
                gdown_file_cmd = ['gdown', g_url, '-O', 'downloads/video.mp4']
                subprocess.run(gdown_file_cmd, check=True)
            except Exception as ex:
                print("❌ Download failed. Check drive link permissions!")
                sys.exit(1)

        # Get all downloaded video files
        video_extensions = ('*.mp4', '*.mkv', '*.mov', '*.avi', '*.webm')
        video_files = []
        for ext in video_extensions:
            video_files.extend(glob.glob(f"downloads/**/{ext}", recursive=True))

        video_files.sort()

        if not video_files:
            print("❌ No video files found in the downloaded Google Drive folder!")
            sys.exit(1)

        print(f"✅ Found {len(video_files)} video file(s) for streaming.")

        # Stream each downloaded video
        for idx, video_path in enumerate(video_files, 1):
            print(f"\n==================================================")
            print(f"🔴 Streaming Video {idx} of {len(video_files)}: {os.path.basename(video_path)}")
            print(f"==================================================")

            ffmpeg_cmd = [
                'ffmpeg', '-y',
                '-re',
                '-i', video_path,
                '-vf', filter_v,
                '-af', filter_a,
                '-c:v', 'libx264',
                '-preset', 'ultrafast',
                '-tune', 'zerolatency',
                '-b:v', '4500k',
                '-maxrate', '5000k',
                '-bufsize', '10000k',
                '-pix_fmt', 'yuv420p',
                '-g', '50',
                '-c:a', 'aac',
                '-b:a', '128k',
                '-ar', '44100',
                '-f', 'flv', f'rtmp://a.rtmp.youtube.com/live2/{s_key}'
            ]

            subprocess.run(ffmpeg_cmd)

            print(f"\n⏹ Video {idx} finished. Stream disconnected.")

            if idx < len(video_files):
                print("⏳ Waiting 15 seconds before starting next video stream...")
                time.sleep(15)

        print("\n🎉 All videos streamed as individual posts successfully!")

        EOF

        python run_stream.py
        
